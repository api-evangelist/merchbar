description: >-
  Merchbar, Inc. is the official merchandise retailer for top musicians, selling
  vinyl records, CDs, t-shirts, hoodies, posters, and other band merchandise
  across thousands of artist storefronts at merchbar.com. It runs a consumer
  shopping experience alongside a "Merchbar for Artists" program and official
  merchandise integrations with YouTube and Spotify. Merchbar is a portfolio
  company of Bullpen Capital. As of this enrichment pass Merchbar publishes no
  public API, developer program, SDKs, or technical documentation — no
  developer/api/docs subdomain resolves and there is no /.well-known/security.txt
  — so this profile captures only its public web presence and probed
  domain-security posture.
